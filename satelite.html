<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satélite &amp; Radar — Defesa Civil MT</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="css/animated-icons.css">
<style>
    :root {
        --bg-base: #0b0f19;
        --bg-dark: #0b0f19;
        --bg-card: #1e293b;
        --bg-card-hover: #293548;
        --accent-orange: #f9731c;
        --accent-orange-hover: #ea580c;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --glass-bg: rgba(30, 41, 59, 0.82);
        --glass-border: rgba(148, 163, 184, 0.18);
        --blue-glow: #38bdf8;
    }
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg-dark); color: var(--text-main); font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; }
    #map { position: absolute; inset: 0; z-index: 1; background: var(--bg-dark); }
    .leaflet-container { background: var(--bg-dark); }
    .leaflet-control-attribution { background: rgba(11,15,25,.8) !important; color: var(--text-muted) !important; font-size: 9.5px !important; }
    .leaflet-control-zoom a { background: var(--glass-bg) !important; color: var(--text-main) !important; border: 1px solid var(--glass-border) !important; }
    .leaflet-control-zoom a:hover { background: var(--bg-card-hover) !important; }
    .leaflet-control-zoom { border: none !important; box-shadow: none !important; }

    /* ===== Cabeçalho (flutuante, Glassmorphism) ===== */
    #headBar {
        position: absolute; top: 14px; left: 14px; z-index: 1100;
        display: flex; align-items: center; gap: 12px;
        background: var(--glass-bg); backdrop-filter: blur(14px);
        border: 1px solid var(--glass-border); border-radius: 12px;
        padding: 8px 14px 8px 10px; box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    #headBar img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; }
    #headBar .hd-txt h1 { font-size: 13px; margin: 0; letter-spacing: .5px; }
    #headBar .hd-txt span { font-size: 9.5px; color: var(--text-muted); letter-spacing: .8px; text-transform: uppercase; }
    #headBar .hd-back { margin-left: 6px; text-decoration: none; color: var(--text-muted); font-size: 11px; display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--glass-border); }
    #headBar .hd-back:hover { color: var(--text-main); background: var(--bg-card-hover); }

    /* ===== Seletor de camadas (canto superior) ===== */
    #layerSel {
        position: absolute; top: 14px; right: 14px; z-index: 1100;
        display: flex; flex-direction: column; gap: 6px; min-width: 210px;
        background: var(--glass-bg); backdrop-filter: blur(18px);
        border: 1px solid var(--glass-border); border-radius: 14px;
        padding: 10px; box-shadow: 0 10px 34px rgba(0,0,0,.45);
    }
    #layerSel .ls-title { font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent-orange); font-weight: 700; padding: 0 2px 4px; display: flex; align-items: center; gap: 6px; }
    #layerSel .ls-title::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
    .ls-btn {
        width: 100%; display: flex; align-items: center; gap: 11px; text-align: left;
        background: transparent; border: 1px solid transparent; border-radius: 9px;
        padding: 9px 11px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-muted);
        transition: all .15s;
    }
    .ls-btn:hover { background: var(--bg-card-hover); color: var(--text-main); }
    .ls-btn.active { background: linear-gradient(90deg, rgba(249,115,22,.14), rgba(249,115,22,.05)); border-color: rgba(249,115,22,.4); color: var(--text-main); }
    .ls-btn i, .ls-btn svg[data-lucide] { color: var(--accent-orange); font-size: 15px; width: 18px; text-align: center; }
    .ls-btn .sub { display: block; font-size: 9px; color: var(--text-muted); font-weight: 400; margin-top: 2px; line-height: 1.3; }

    /* ===== Painel temporal inferior (Glassmorphism) ===== */
    #timeline {
        position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 1100;
        width: min(760px, calc(100vw - 24px));
        background: var(--glass-bg); backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border); border-radius: 16px;
        padding: 12px 14px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
        display: flex; flex-direction: column; gap: 8px;
    }
    .tl-rows { display: flex; align-items: center; gap: 12px; }
    .tl-ctrls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .tc-btn {
        width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
        background: var(--bg-card); color: var(--text-main); font-size: 15px;
        display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .tc-btn:hover { background: var(--bg-card-hover); }
    .tc-btn.play { width: 46px; height: 46px; background: var(--accent-orange); color: #fff; }
    .tc-btn.play:hover { background: var(--accent-orange-hover); }
    .tl-mid { flex: 1; min-width: 0; }
    .tl-info { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    #tlFlags { font-size: 10px; color: var(--accent-orange); text-transform: uppercase; letter-spacing: .6px; font-weight: 700; }
    #tlTime { font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
    #tlTime small { font-size: 10px; color: var(--text-muted); font-weight: 500; margin-left: 6px; }
    #tlRel { font-size: 10px; color: var(--text-muted); margin-left: 2px; }
    #tlRel.live { color: #34d399; }
    #timeSlider { width: 100%; cursor: pointer; }
    .tl-ticks { display: flex; justify-content: space-between; margin-top: 3px; font-size: 9px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .tl-speed { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .tl-speed .sp-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
    .spd-btn {
        border: 1px solid var(--glass-border); background: var(--bg-card); color: var(--text-muted);
        font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: all .15s;
    }
    .spd-btn:hover { background: var(--bg-card-hover); color: var(--text-main); }
    .spd-btn.active { background: var(--accent-orange); border-color: var(--accent-orange); color: #fff; }
    .tl-src { font-size: 8.5px; color: var(--text-muted); text-align: right; line-height: 1.4; opacity: .8; }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; background: var(--bg-card); outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--accent-orange); cursor: pointer; box-shadow: 0 2px 8px rgba(249,115,22,.5); }
    input[type="range"]::-moz-range-thumb { width: 15px; height: 15px; border: none; border-radius: 50%; background: var(--accent-orange); cursor: pointer; }

    /* ===== Legenda dinâmica (canto inferior, muda por camada) ===== */
    #legend {
        position: absolute; left: 16px; bottom: 18px; z-index: 1100;
        max-width: 260px;
        background: var(--glass-bg); backdrop-filter: blur(18px);
        border: 1px solid var(--glass-border); border-radius: 12px;
        padding: 10px 12px; font-size: 10px; color: var(--text-muted);
        box-shadow: 0 8px 32px rgba(0,0,0,.4); display: none; flex-direction: column; gap: 6px;
    }
    #legend.show { display: flex; }
    .lg-title { font-size: 9.5px; font-weight: 700; letter-spacing: .6px; color: var(--text-main); text-transform: uppercase; }
    .lg-bar { height: 10px; width: 150px; border-radius: 5px; margin: 2px 0; }
    .lg-labels { display: flex; justify-content: space-between; width: 150px; font-size: 8.5px; }
    .lg-note { font-size: 8.5px; opacity: .85; line-height: 1.5; }

    /* ===== Overlay de carregamento ===== */
    #loadMsg {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1200;
        background: var(--glass-bg); backdrop-filter: blur(16px);
        border: 1px solid var(--glass-border); border-radius: 12px;
        padding: 14px 20px; font-size: 12px; display: flex; align-items: center; gap: 10px;
        box-shadow: 0 10px 34px rgba(0,0,0,.45); display: none;
    }
    #loadMsg.show { display: flex; }
    .lucide-spin { animation: luSpin 1.1s linear infinite; }
    @keyframes luSpin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
        #layerSel { min-width: 170px; top: auto; bottom: 86px; right: 10px; }
        #headBar { top: 10px; left: 10px; padding: 6px 10px; }
        #headBar img { width: 28px; height: 28px; }
        #headBar .hd-back span { display: none; }
        .tl-ctrls .tc-btn { width: 34px; height: 34px; }
        .tl-ctrls .tc-btn.play { width: 40px; height: 40px; }
        #legend { left: 10px; bottom: 10px; max-width: 210px; }
    }
</style>
</head>
<body>
<div id="map"></div>

<div id="headBar">
    <img src="imagens/logo.png" alt="Defesa Civil MT" onerror="this.style.display='none'">
    <div class="hd-txt">
        <h1>SATÉLITE &amp; RADAR</h1>
        <span>Animação de nuvens · GOES-East</span>
    </div>
    <a class="hd-back" href="mapa.html"><i data-lucide="arrow-left"></i><span>Mapa</span></a>
</div>

<div id="layerSel">
    <div class="ls-title"><i data-lucide="layers"></i> Camada</div>
    <button class="ls-btn active" data-layer="vis">
        <i data-lucide="sun"></i>
        <span>Satélite (Visível)<span class="sub">GOES-East GeoColor · cor verdadeira</span></span>
    </button>
    <button class="ls-btn" data-layer="ir">
        <i data-lucide="thermometer"></i>
        <span>Infravermelho<span class="sub">GOES-East Band 13 · temperatura do topo</span></span>
    </button>
    <button class="ls-btn" data-layer="radar">
        <i data-lucide="cloud-rain"></i>
        <span>Radar de Precipitação<span class="sub">RainViewer · reflectividade</span></span>
    </button>
</div>

<div id="timeline">
    <div class="tl-rows">
        <div class="tl-ctrls">
            <button class="tc-btn" id="btnPrev" title="Quadro anterior (←)"><i data-lucide="skip-back"></i></button>
            <button class="tc-btn play" id="btnPlay" title="Reproduzir / pausar (Espaço)"><i data-lucide="pause"></i></button>
            <button class="tc-btn" id="btnNext" title="Próximo quadro (→)"><i data-lucide="skip-forward"></i></button>
        </div>
        <div class="tl-mid">
            <div class="tl-info">
                <div id="tlFlags">Carregando imagens...</div>
                <div><span id="tlTime">--:--<small id="tlDate"></small></span><span id="tlRel"></span></div>
            </div>
            <input type="range" id="timeSlider" min="0" max="0" value="0" step="1" disabled>
            <div class="tl-ticks"><span id="tickStart"></span><span id="tickNow">agora</span><span id="tickEnd"></span></div>
        </div>
    </div>
    <div class="tl-rows" style="justify-content:flex-end;">
        <div class="tl-speed">
            <span class="sp-lbl">Velocidade</span>
            <button class="spd-btn active" data-speed="1">1x</button>
            <button class="spd-btn" data-speed="2">2x</button>
            <button class="spd-btn" data-speed="4">4x</button>
        </div>
    </div>
    <div class="tl-src" id="tlSrc"></div>
</div>

<div id="legend"></div>

<div id="loadMsg"><i data-lucide="loader" class="lucide-spin"></i><span id="loadTxt">Carregando...</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="js/proxy.js"></script>
<script>
/* ============================================================
   Módulo: SATÉLITE & RADAR — animação de imagens de nuvens.
   Fontes:
     - Satélite Visível / Infravermelho: NASA GIBS WMTS (GOES-East)
     - Radar de precipitação:            RainViewer (tiles públicos)
   Estado local da página (sem backend).
   ============================================================ */
(function () {
    'use strict';

    /* ---------- Mapa ---------- */
    const map = L.map('map', {
        zoomControl: true,
        maxZoom: 18,
        zoomSnap: 0.5,
        attributionControl: true
    }).setView([-14.5, -55.5], 5);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18, maxNativeZoom: 16,
        attribution: '&copy; Esri &copy; OpenStreetMap'
    }).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 18, maxNativeZoom: 16,
        attribution: '&copy; Esri'
    }).addTo(map);
    L.control.scale({ position: 'bottomright', imperial: false }).addTo(map);

    /* ---------- Estado da animação ---------- */
    const LAYERS = {
        vis:   { label: 'Satélite (Visível)', flag: 'GOES-East · GeoColor' },
        ir:    { label: 'Infravermelho',      flag: 'GOES-East · Band 13' },
        radar: { label: 'Radar de Precipitação', flag: 'RainViewer' }
    };
    let activeLayer = 'vis';
    let frames = [];            // [{ time, url, ready }]
    let tileLayers = [];        // L.tileLayer por frame
    let frameIdx = 0;
    let playing = true;
    let playTimer = null;
    let speed = 1;
    const BASE_INTERVAL = 900;  // ms a 1x

    const els = {
        flags: document.getElementById('tlFlags'),
        time: document.getElementById('tlTime'),
        rel: document.getElementById('tlRel'),
        slider: document.getElementById('timeSlider'),
        play: document.getElementById('btnPlay'),
        prev: document.getElementById('btnPrev'),
        next: document.getElementById('btnNext'),
        legend: document.getElementById('legend'),
        src: document.getElementById('tlSrc'),
        msg: document.getElementById('loadMsg'),
        msgTxt: document.getElementById('loadTxt'),
        tickStart: document.getElementById('tickStart'),
        tickEnd: document.getElementById('tickEnd')
    };

    function setLoading(on, txt) {
        els.msg.classList.toggle('show', !!on);
        if (txt) els.msgTxt.textContent = txt;
    }

    function fmtUTC(unix) {
        return new Date(unix * 1000).toISOString().slice(11, 16) + 'Z';
    }
    function fmtDate(unix) {
        return new Date(unix * 1000).toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
    }
    function isoUTC(d) {
        return d.toISOString().slice(0, 19) + 'Z';
    }

    /* ---------- Construção de frames ----------
       Satélite: janela temporal recente (referência na leitura das imagens).
       Como a WMTS do GIBS aceita o parâmetro Time e resolve o quadro mais
       próximo publicado, geramos uma série uniforme de horários no passado. */
    function buildSatFrames(count, stepMin) {
        const now = new Date();
        const out = [];
        for (let i = count - 1; i >= 0; i--) {
            const t = new Date(now.getTime() - (i * stepMin + 15) * 60000);
            out.push({ time: Math.floor(t.getTime() / 1000), iso: isoUTC(t) });
        }
        return out;
    }

    /* ---------- Fontes de tile por frame ---------- */
    const GIBS = 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best';
    function gibsFrame(layer, f) {
        if (layer === 'vis') {
            return `${GIBS}/GOES-East_ABI_GeoColor/default/${f.iso}/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png`;
        }
        return `${GIBS}/GOES-East_ABI_Band13_Clean_Infrared/default/${f.iso}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png`;
    }
    function makeSatLayer(layer, f) {
        return L.tileLayer(gibsFrame(layer, f), {
            opacity: 0, maxZoom: 12,
            maxNativeZoom: layer === 'vis' ? 7 : 6,
            zIndex: 10
        });
    }
    function makeRadarLayer(f) {
        return L.tileLayer(`${f.host}${f.path}/512/{z}/{x}/{y}/4/1_1.png`, {
            opacity: 0, tileSize: 512, maxZoom: 12, zIndex: 10
        });
    }

    /* ---------- Carregar frames (por camada) ---------- */
    async function loadRadarFrames() {
        setLoading(true, 'Buscando radar RainViewer...');
        try {
            const res = await dcProxyFetch('https://api.rainviewer.com/public/weather-maps.json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const w = await res.json();
            const combo = [...(w.radar?.past || []), ...(w.radar?.nowcast || [])];
            if (!combo.length) throw new Error('sem frames');
            frames = combo.map(f => ({ time: f.time, host: w.host, path: f.path }));
            tilesToLayers('radar');
        } catch (e) {
            els.flags.textContent = 'Radar indisponível';
            toast('Não foi possível carregar o radar RainViewer.');
        }
        setLoading(false);
    }

    async function loadSatFrames(layer) {
        setLoading(true, layer === 'vis' ? 'Baixando imagens de satélite (GOES-East)...' : 'Baixando imagens no infravermelho...');
        try {
            frames = buildSatFrames(15, 20);
            tilesToLayers(layer);
            els.flags.textContent = LAYERS[layer].flag;
        } finally {
            setLoading(false);
        }
    }

    function tilesToLayers(layer) {
        tileLayers.forEach(l => { try { map.removeLayer(l); } catch {} });
        tileLayers = [];
        frames.forEach((f, i) => {
            const lay = layer === 'radar' ? makeRadarLayer(f) : makeSatLayer(layer, f);
            lay.addTo(map);
            tileLayers.push(lay);
            lay.on('tileload', () => { if (!f._ok) f._ok = 1; });
        });
        els.slider.max = Math.max(0, frames.length - 1);
        els.slider.disabled = frames.length === 0;
        els.tickStart.textContent = frames.length ? fmtUTC(frames[0].time) : '';
        els.tickEnd.textContent = frames.length ? fmtUTC(frames[frames.length - 1].time) : '';
        if (frames.length) {
            els.slider.value = frames.length - 1;
            frameIdx = frames.length - 1;
        }
        els.src.textContent = layer === 'radar'
            ? 'Fonte: RainViewer (tiles públicos) · tiles de precipitação 512×512'
            : 'Fonte: NASA GIBS WMTS · GOES-East — tiles {Time} na resolução mais recente publicada';
        showFrame(frameIdx);
        play();
    }

    /* ---------- Exibição de quadro ---------- */
    function showFrame(i) {
        if (!frames.length) return;
        i = Math.max(0, Math.min(frames.length - 1, i));
        frameIdx = i;
        tileLayers.forEach((l, k) => l.setOpacity(0));
        if (tileLayers[i]) tileLayers[i].setOpacity(1);
        els.slider.value = i;

        const f = frames[i];
        els.time.innerHTML = `${fmtUTC(f.time)}<small id="tlDate">${fmtDate(f.time)}</small>`;
        const nowMs = Date.now();
        const deltaMin = Math.round((nowMs - f.time * 1000) / 60000);
        if (deltaMin <= 0) { els.rel.textContent = '· agora'; els.rel.className = 'live'; }
        else if (deltaMin < 60) { els.rel.textContent = '· ' + deltaMin + ' min atrás'; els.rel.className = ''; }
        else { els.rel.textContent = '· ' + Math.round(deltaMin / 60) + ' h atrás'; els.rel.className = ''; }
    }

    /* ---------- Playback ---------- */
    function play() {
        playing = true;
        els.play.innerHTML = '<i data-lucide="pause"></i>';
        els.play.title = 'Pausar (Espaço)';
        if (window.lucide) lucide.createIcons();
        clearInterval(playTimer);
        playTimer = setInterval(() => {
            if (!frames.length) return;
            showFrame((frameIdx + 1) % frames.length);
        }, BASE_INTERVAL / speed);
    }
    function pause() {
        playing = false;
        clearInterval(playTimer);
        els.play.innerHTML = '<i data-lucide="play"></i>';
        els.play.title = 'Reproduzir (Espaço)';
        if (window.lucide) lucide.createIcons();
    }
    function togglePlay() { playing ? pause() : play(); }
    function step(dir) {
        pause();
        if (!frames.length) return;
        showFrame((frameIdx + dir + frames.length) % frames.length);
    }

    /* ---------- Eventos ---------- */
    els.play.addEventListener('click', togglePlay);
    els.prev.addEventListener('click', () => step(-1));
    els.next.addEventListener('click', () => step(1));
    els.slider.addEventListener('input', e => {
        pause();
        showFrame(+e.target.value);
    });
    document.querySelectorAll('.spd-btn').forEach(b => {
        b.addEventListener('click', () => {
            document.querySelectorAll('.spd-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            speed = +b.dataset.speed;
            if (playing) play();
        });
    });
    document.querySelectorAll('.ls-btn').forEach(b => {
        b.addEventListener('click', () => {
            const key = b.dataset.layer;
            if (key === activeLayer) return;
            document.querySelectorAll('.ls-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            activeLayer = key;
            pause();
            renderLegend();
            if (key === 'radar') loadRadarFrames();
            else loadSatFrames(key);
        });
    });
    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        else if (e.key === 'ArrowLeft') step(-1);
        else if (e.key === 'ArrowRight') step(1);
    });

    /* ---------- Legenda dinâmica (muda a escala por camada) ---------- */
    function renderLegend() {
        const g = {
            vis: {
                css: 'linear-gradient(90deg,#0f172a,#1d4ed8,#0e7490,#3f6212,#b91c1c,#f1f5f9)',
                labels: ['Noite', '', 'Oceano', 'Continente', '', 'Nuvens'],
                note: 'Cor verdadeira (GeoColor): nuvens em branco/brilhante; continente em marrom/verde; oceano em azul; áreas escuras sem iluminação solar.'
            },
            ir: {
                css: 'linear-gradient(90deg,#000000,#3f3f46,#71717a,#a1a1aa,#d4d4d8,#ffffff)',
                labels: ['Quente', '', '', '', '', 'Frio'],
                note: 'Band 13 (canal infravermelho): brilho proporcional à temperatura — topo de nuvens altas/espessas aparece frio (branco); solo e nuvens baixas, quentes (escuro).'
            }
        };
        const radarCfg = {
            css: 'linear-gradient(90deg,#1e90ff,#00e400,#ffff00,#e68c00,#ff0000,#b40000)',
            labels: ['Fraca', 'Moderada', 'Forte'],
            note: 'Reflectividade do radar sobre o continente americano: intensidade de precipitação no momento observado (RainViewer).'
        };
        const cfg = activeLayer === 'radar' ? radarCfg : g[activeLayer];
        els.legend.innerHTML = `
            <div class="lg-title">${LAYERS[activeLayer].label}</div>
            <div class="lg-bar" style="background:${cfg.css};"></div>
            <div class="lg-labels">${cfg.labels.map((x, i) => `<span style="${i === 0 ? 'text-align:left' : i === cfg.labels.length - 1 ? 'text-align:right' : 'text-align:center'}">${x}</span>`).join('')}</div>
            <div class="lg-note">${cfg.note}</div>`;
        els.legend.classList.add('show');
    }

    /* ---------- Toast local ---------- */
    function toast(msg) {
        let t = document.getElementById('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.style.cssText = 'position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:1300;background:var(--glass-bg);backdrop-filter:blur(14px);border:1px solid var(--glass-border);border-left:3px solid #ef4444;border-radius:8px;padding:9px 14px;font-size:11.5px;color:#fecaca;box-shadow:0 8px 28px rgba(0,0,0,.4);transition:opacity .3s;';
            document.body.appendChild(t);
        }
        t.style.opacity = '1';
        t.textContent = msg;
        clearTimeout(t._to);
        t._to = setTimeout(() => { t.style.opacity = '0'; }, 3200);
    }

    /* ---------- Bootstrap ---------- */
    if (window.lucide) lucide.createIcons();
    renderLegend();
    loadSatFrames('vis');
})();
</script>
</body>
</html>
